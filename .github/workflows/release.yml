name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      # Commit the version bump and open the version pull request.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build Server
        run: pnpm --filter @nestlyjs/server build

      - name: Check package contents
        run: node scripts/check-pack.mjs

      # `changeset version` exits non-zero when nothing is pending, and on most
      # pushes that is the normal state, so only run it when there is work.
      - name: Check for pending changesets
        id: changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $pending"

      # Version only. Publishing lives in publish.yml so that OIDC permission
      # is never granted to the job that can write pull requests.
      - name: Create or update the version pull request
        if: steps.changesets.outputs.pending != '0'
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm exec changeset version
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
