name: Publish

# The only workflow that can publish to npm. It is deliberately narrow: a push
# to `main`, in this repository, in this workflow file. Everything else is a
# guard that fails before npm is contacted. See docs/RELEASING.md.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # npm's trusted publisher is bound to this repository and this workflow
    # filename; these guards make a fork or another branch fail here instead.
    if: >-
      github.repository == 'The-Code-Monkey/NestlyJS' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment's branch policy allows `main` only, so GitHub itself
    # refuses to start this job from any other ref.
    environment: npm-publish
    permissions:
      # Git tags and GitHub releases for the published version.
      contents: write
      # Read the pull requests associated with the release commit.
      pull-requests: read
      # npm trusted publishing. No npm token is stored in this repository.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GitHub records which pull request a commit came from, and a direct
      # push has no such record. Commit messages cannot forge it. This stops a
      # direct push to main; it cannot stop a direct push that also rewrites
      # this file, which is why docs/RELEASING.md describes the remaining gap.
      - name: Verify the release came through a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          check_merged() {
            sha="$1"
            label="$2"
            count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
            if [ "$count" -eq 0 ]; then
              echo "Refusing to publish: the $label ($sha) is not associated with a merged pull request"
              exit 1
            fi
          }
          check_merged "$GITHUB_SHA" "release commit"
          check_merged "$(git log -1 --format=%H -- .github/workflows/publish.yml)" "last change to publish.yml"

      - name: Verify release context
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "The-Code-Monkey/NestlyJS" || {
            echo "Refusing to publish outside The-Code-Monkey/NestlyJS"; exit 1;
          }
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Refusing to publish from $GITHUB_REF"; exit 1;
          }
          test "$GITHUB_EVENT_NAME" = "push" || {
            echo "Refusing to publish from a $GITHUB_EVENT_NAME event"; exit 1;
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "Refusing to publish a commit that is not on main"; exit 1;
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release workflow guards
        run: node scripts/check-release-workflow.mjs

      - name: Build Server
        run: pnpm --filter @nestlyjs/server build

      - name: Check package contents
        run: node scripts/check-pack.mjs

      # Publishing before `changeset version` has run would push an unversioned
      # package, and CI must never publish a prerelease. Prereleases are
      # published by hand; see docs/RELEASING.md.
      - name: Check release state
        id: release-state
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ -f .changeset/pre.json ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Prerelease mode is active; skipping publish."
          elif [ "$pending" != "0" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Pending changesets; waiting for the version pull request."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Versioned tree with no pending changesets; publishing."
          fi

      - name: Publish to npm
        if: steps.release-state.outputs.pending == '0' && steps.release-state.outputs.prerelease == 'false'
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm exec changeset publish
          create-github-releases: true
          push-git-tags: true
