name: Test Test-App

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test

      - name: Build Server
        run: yarn workspace @nestlyjs/server build

      - name: Check package contents
        run: node scripts/check-pack.mjs

      - name: Run route integration tests
        run: |
          set -euo pipefail
          cd packages/test-app
          PORT=4000 node ../../packages/server/dist/bin/nestly.js dev > /tmp/nestly-dev.log 2>&1 &
          server_pid=$!
          cd ../..

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            pkill -f "dist/bin/nestly.js dev" || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Dev server exited early"
              break
            fi
            if curl -fsS http://127.0.0.1:4000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/nestly-dev.log
            exit 1
          fi

          if ! yarn workspace test-app test:routes; then
            cat /tmp/nestly-dev.log
            exit 1
          fi

      - name: Build production app
        run: |
          cd packages/test-app
          node ../../packages/server/dist/bin/nestly.js build

      - name: Run production route integration tests
        run: |
          set -euo pipefail
          cd packages/test-app
          PORT=4000 node ../../packages/server/dist/bin/nestly.js start > /tmp/nestly-prod.log 2>&1 &
          server_pid=$!
          cd ../..

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            pkill -f "dist/bin/nestly.js start" || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Production server exited early"
              break
            fi
            if curl -fsS http://127.0.0.1:4000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/nestly-prod.log
            exit 1
          fi

          if ! yarn workspace test-app test:routes; then
            cat /tmp/nestly-prod.log
            exit 1
          fi
