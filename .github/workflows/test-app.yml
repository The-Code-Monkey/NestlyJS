name: Test Test-App

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test

      - name: Build Server
        run: yarn workspace @nestlyjs/server build

      - name: Check package contents
        run: node scripts/check-pack.mjs

      - name: Run route integration tests
        run: |
          set -euo pipefail
          PORT=4000 yarn workspace test-app dev > /tmp/nestly-dev.log 2>&1 &
          server_pid=$!

          cleanup() {
            pkill -f "dist/bin/nestly.js dev" || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          yarn workspace test-app test:routes
